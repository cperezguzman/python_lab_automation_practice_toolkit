name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Smoke test I-V experiment
        env:
          MPLBACKEND: Agg
        run: python src/main.py --experiment iv --config examples/example_iv_config.json

      - name: Smoke test resonance experiment
        env:
          MPLBACKEND: Agg
        run: python src/main.py --experiment resonance --config examples/example_resonance_config.json
